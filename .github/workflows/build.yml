name: Build Windows Executable

on:
  push:
    branches:
      - main  # Triggers the build whenever you push to the main branch

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Change this to match your target Python version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller --onefile your_app.py # Replace your_app.py with your main script name

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/*.exe