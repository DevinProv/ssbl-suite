name: Build Windows Executable

on:
  push:
    branches:
      - main        # CI build + artifact on every push to main
    tags:
      - 'v*'        # pushing a version tag (e.g. v1.0.1) also publishes a Release

permissions:
  contents: write   # required for creating GitHub Releases

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      # Bundle templates + static into the exe (Windows --add-data uses ';').
      # Without this the frozen app can't find dashboard.html and 500s.
      run: >
        pyinstaller --onefile --noconfirm
        --add-data "templates;templates"
        --add-data "static;static"
        --hidden-import simple_websocket
        app.py

    - name: Generate SHA-256 checksum
      shell: pwsh
      run: |
        $exe  = Get-ChildItem dist/*.exe | Select-Object -First 1
        $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
        # Sidecar the in-app updater looks for: "<exe>.sha256", "<hash>  <name>" format
        "$hash  $($exe.Name)" | Out-File -FilePath "$($exe.FullName).sha256" -Encoding ascii -NoNewline
        Write-Host "SHA-256($($exe.Name)) = $hash"

    - name: Upload Executable (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: |
          dist/*.exe
          dist/*.exe.sha256

    - name: Publish Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.exe
          dist/*.exe.sha256
