name: Build Executables

on:
  push:
    branches:
      - main        # CI build + artifact on every push to main
    tags:
      - 'v*'        # pushing a version tag (e.g. v1.0.1) also publishes a Release

permissions:
  contents: write   # required for creating GitHub Releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      # Bundle templates + static into the exe (Windows --add-data uses ';').
      # Without this the frozen app can't find dashboard.html and 500s.
      # --name gives the release asset a clear, platform-specific filename;
      # it still ends in .exe so the in-app updater keeps recognizing it.
      run: >
        pyinstaller --onefile --noconfirm --name SSBL-Suite-Windows
        --add-data "templates;templates"
        --add-data "static;static"
        --hidden-import simple_websocket
        app.py

    - name: Generate SHA-256 checksum
      shell: pwsh
      run: |
        $exe  = Get-ChildItem dist/*.exe | Select-Object -First 1
        $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
        # Sidecar the in-app updater looks for: "<exe>.sha256", "<hash>  <name>" format
        "$hash  $($exe.Name)" | Out-File -FilePath "$($exe.FullName).sha256" -Encoding ascii -NoNewline
        Write-Host "SHA-256($($exe.Name)) = $hash"

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          dist/*.exe
          dist/*.exe.sha256

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      # Linux --add-data uses ':' as the separator (not ';' like Windows).
      run: >
        pyinstaller --onefile --noconfirm --name SSBL-Suite-Linux
        --add-data "templates:templates"
        --add-data "static:static"
        --hidden-import simple_websocket
        app.py

    - name: Generate SHA-256 checksum
      run: |
        cd dist
        sha256sum SSBL-Suite-Linux > SSBL-Suite-Linux.sha256
        cat SSBL-Suite-Linux.sha256

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: |
          dist/SSBL-Suite-Linux
          dist/SSBL-Suite-Linux.sha256

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true   # flatten windows-build + linux-build into dist/

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true   # append an auto changelog below the body
        body: |
          ## Downloads

          **Windows**
          1. Download **both** `SSBL-Suite-Windows.exe` **and** `SSBL-Suite-Windows.exe.sha256` into the **same folder**.
          2. Double-click `SSBL-Suite-Windows.exe`, then open <http://localhost:5000>.

          **Linux**
          1. Download **both** `SSBL-Suite-Linux` **and** `SSBL-Suite-Linux.sha256` into the **same folder**.
          2. `chmod +x SSBL-Suite-Linux && ./SSBL-Suite-Linux`, then open <http://localhost:5000>.

          > Keep the `.sha256` next to its binary — it's the published checksum so you can verify your download is intact and authentic.
        files: |
          dist/*.exe
          dist/*.exe.sha256
          dist/SSBL-Suite-Linux
          dist/SSBL-Suite-Linux.sha256
