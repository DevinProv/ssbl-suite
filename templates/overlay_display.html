<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: transparent;
            overflow: hidden;
        }
        #overlay-root {
            position: relative;
            width: 100%; height: 100%;
        }
        .overlay-el {
            position: absolute;
            pointer-events: none;
            white-space: nowrap;
        }
        .overlay-el.hidden { display: none; }
        .overlay-image img {
            display: block;
            width: 100%; height: 100%;
            object-fit: contain;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Oswald:wght@700&family=Bebas+Neue&family=Anton&family=Barlow+Condensed:wght@700&family=Teko:wght@700&family=Russo+One&family=Exo+2:wght@700&family=Orbitron:wght@700&family=Black+Han+Sans&display=swap" rel="stylesheet">
</head>
<body>
    <div id="overlay-root"></div>
    <script>
        let config = null;
        let state = {
            player1: { name: "Player 1", char: "", color: "", score: 0 },
            player2: { name: "Player 2", char: "", color: "", score: 0 },
            round: "",
            event: "",
            active_scene: ""
        };

        let ws;
        function connectWS() {
            ws = new WebSocket(`ws://${location.host}/ws/overlay`);
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === "state") {
                    state = msg.data;
                    renderOverlay();
                } else if (msg.type === "config") {
                    config = msg.data;
                    renderOverlay();
                } else if (msg.type === "scene_change") {
                    // Server pushed a scene change — update config and active scene
                    state.active_scene = msg.scene;
                    config = msg.data;
                    renderOverlay();
                }
            };
            ws.onclose = () => setTimeout(connectWS, 1000);
        }
        connectWS();

        async function init() {
            const [cfgRes, stateRes] = await Promise.all([
                fetch("/api/overlay/config").then(r => r.json()),
                fetch("/api/overlay/state").then(r => r.json())
            ]);
            config = cfgRes;
            state = stateRes;
            renderOverlay();
        }
        init();

        function getActiveElements() {
            if (!config) return {};
            const sceneName = state.active_scene || config.active_scene;
            if (!sceneName || !config.scenes || !config.scenes[sceneName]) {
                // Fallback to first scene
                const first = Object.keys(config.scenes || {})[0];
                if (first) return config.scenes[first].elements;
                return {};
            }
            return config.scenes[sceneName].elements;
        }

        function getElementContent(key) {
            switch (key) {
                case "p1_name":    return state.player1.name;
                case "p2_name":    return state.player2.name;
                case "p1_score":   return String(state.player1.score);
                case "p2_score":   return String(state.player2.score);
                case "round_name": return state.round;
                case "event_name": return state.event;
                default: return "";
            }
        }

        function getPortraitSrc(key) {
            if (key === "p1_portrait") {
                const { char, color } = state.player1;
                return char && color ? `/api/characters/${char}/${color}/image` : "";
            }
            if (key === "p2_portrait") {
                const { char, color } = state.player2;
                return char && color ? `/api/characters/${char}/${color}/image` : "";
            }
            return "";
        }

        function renderOverlay() {
            if (!config) return;
            const root = document.getElementById("overlay-root");
            const { width, height } = config.resolution;

            const scaleX = window.innerWidth / width;
            const scaleY = window.innerHeight / height;
            const scale = Math.min(scaleX, scaleY);

            const renderedW = width * scale;
            const renderedH = height * scale;
            const offsetX = (window.innerWidth - renderedW) / 2;
            const offsetY = (window.innerHeight - renderedH) / 2;

            root.style.width = width + "px";
            root.style.height = height + "px";
            root.style.transformOrigin = "top left";
            root.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;

            const elements = getActiveElements();

            // Remove nodes for elements no longer in this scene
            root.querySelectorAll(".overlay-el").forEach(node => {
                const key = node.id.replace("el-", "");
                if (!elements[key]) node.remove();
            });

            Object.entries(elements).forEach(([key, el]) => {
                let node = document.getElementById(`el-${key}`);
                if (!node) {
                    node = document.createElement("div");
                    node.id = `el-${key}`;
                    root.appendChild(node);
                }

                node.className = `overlay-el overlay-${el.type}${el.visible ? "" : " hidden"}`;
                node.style.left = el.x + "px";
                node.style.top = el.y + "px";
                node.style.opacity = el.opacity;

                if (el.type === "text") {
                    node.textContent = getElementContent(key);
                    node.style.fontFamily = `'${el.font}', sans-serif`;
                    node.style.fontSize = el.fontSize + "px";
                    node.style.fontWeight = "700";
                    node.style.color = el.fontColor;
                    node.style.textShadow = el.shadow
                        ? `2px 2px 4px ${el.shadowColor}, 0 0 8px ${el.shadowColor}`
                        : "none";
                    if (el.background) {
                        const hex = el.bgColor;
                        const r = parseInt(hex.slice(1,3),16);
                        const g = parseInt(hex.slice(3,5),16);
                        const b = parseInt(hex.slice(5,7),16);
                        node.style.background = `rgba(${r},${g},${b},${el.bgOpacity})`;
                        node.style.borderRadius = el.borderRadius + "px";
                        node.style.padding = "4px 10px";
                    } else {
                        node.style.background = "transparent";
                        node.style.padding = "0";
                    }
                } else if (el.type === "image") {
                    node.style.width = el.width + "px";
                    node.style.height = el.height + "px";
                    let img = node.querySelector("img");
                    if (!img) {
                        img = document.createElement("img");
                        node.appendChild(img);
                    }
                    const src = getPortraitSrc(key);
                    if (img.src !== location.origin + src) img.src = src;
                    node.style.display = src ? "block" : "none";
                }
            });
        }

        window.addEventListener("resize", renderOverlay);
    </script>
</body>
</html>
