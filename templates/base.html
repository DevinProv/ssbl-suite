<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SSBL{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:              {{ theme.bg }};
            --surface:         {{ theme.surface }};
            --surface-2:       {{ theme.surface_2 }};
            --surface-3:       {{ theme.surface_3 }};
            --primary:         {{ theme.primary }};
            --primary-dim:     {{ theme.primary_dim }};
            --secondary:       {{ theme.secondary }};
            --on-primary:      {{ theme.on_primary }};
            --on-surface:      {{ theme.on_surface }};
            --on-surface-dim:  {{ theme.on_surface_dim }};
            --outline:         {{ theme.outline }};
            --outline-bright:  {{ theme.outline_bright }};
            --danger:          {{ theme.danger }};
            --success:         {{ theme.success }};
            --warning:         {{ theme.warning }};
        }
    </style>
    {% block styles %}{% endblock %}
</head>

<body>
    <nav class="sidebar">
        <a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' or request.path == '/' else '' }}">Dashboard</a>
        <a href="/overlay" class="{{ 'active' if request.path == '/overlay' else '' }}">Overlay</a>
        <a href="/players" class="{{ 'active' if request.path == '/players' else '' }}">Players</a>
        <a href="/video" class="{{ 'active' if request.path == '/video' else '' }}">Video</a>
        <a href="/events" class="{{ 'active' if request.path == '/events' else '' }}">Events</a>
        <a href="/settings" class="{{ 'active' if request.path == '/settings' else '' }}">Settings</a>
        
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <!-- Global "update available" modal (shown when a new version is staged) -->
    <div class="modal-overlay" id="update-modal-overlay">
        <div class="modal" style="width:440px;max-width:calc(100vw - 48px)">
            <div class="modal-header">
                <span class="modal-title">Update available</span>
                <button class="modal-close" id="update-modal-close">✕</button>
            </div>
            <div class="modal-body">
                <p style="font-size:13px;color:var(--on-surface);line-height:1.6">
                    <strong id="update-modal-version">A new version</strong> is ready to install.
                    Updating closes and reopens the app. If you skip it, it'll be applied
                    automatically the next time you open the app.
                </p>
            </div>
            <div class="modal-footer">
                <button class="btn-ghost" id="update-modal-later">Later</button>
                <button class="btn-primary" id="update-modal-now">Update &amp; Restart</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/update.js') }}"></script>
</body>

</html>
